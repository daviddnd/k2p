server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls are proxied to the backend service on the compose network.
    # No URI part on proxy_pass: the `/api/` prefix must reach FastAPI
    # unchanged (every route is `/api/v1/...`); a trailing slash here would
    # strip it and every call would 404.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
