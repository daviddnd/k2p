# TLS termination (Phase 7 task C4; ruling R8). Ships in the frontend image as
# /etc/nginx/tls.conf; the compose command installs it as the active config
# ONLY when a certificate directory is mounted at /etc/nginx/certs holding
# fullchain.pem + privkey.pem (AICS_TLS_CERT_DIR). Without certs the plain
# deploy/nginx.conf stays active and the stack serves port 80 exactly as
# before — the loopback/dev posture is unchanged.

server {
    listen 80;

    # Plain HTTP redirects once TLS is terminated here.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    # Documented fallback for clients that cannot negotiate 1.3 (the NFR asks
    # for 1.3; enable 1.2 deliberately, per deployment, if needed):
    # ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls are proxied to the backend service on the compose network.
    # No URI part on proxy_pass: the `/api/` prefix must reach FastAPI
    # unchanged (every route is `/api/v1/...`).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
